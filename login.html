<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title data-i18n="title_login">KitchenShare - Sign In</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23465844'/><text x='50' y='70' font-size='56' text-anchor='middle' fill='%23F6F9F2' font-family='Arial,Helvetica,sans-serif' font-weight='700'>K</text></svg>"/>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="tailwind.css" />
<link rel="manifest" href="manifest.webmanifest"/>
<!-- dev fallback (runtime JIT, slower): <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script> -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<script src="tailwind.config.js"></script>

  </head>
<body class="bg-surface text-on-surface antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-sm">
<div class="flex items-center justify-between px-container-margin h-touch-target-min pt-safe">
<button data-action="menu" class="text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 duration-200 p-2 -ml-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary" aria-label="Open menu" data-i18n-aria="drawer_open_menu">
<span class="material-symbols-outlined">restaurant_menu</span>
</button>
<h1 class="font-display-lg text-headline-md text-primary dark:text-primary-fixed-dim tracking-tight">KitchenShare</h1>
<button data-action="notifications" class="text-on-surface-variant dark:text-outline-variant hover:opacity-80 transition-opacity active:scale-95 duration-200 p-2 -mr-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary" aria-label="Open notifications" data-i18n-aria="notif_open">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-[calc(48px+env(safe-area-inset-top,20px))] pb-[calc(80px+env(safe-area-inset-bottom,20px))] px-container-margin md:max-w-md md:mx-auto">
<div class="mt-stack-gap-lg bg-surface-container-lowest rounded-3xl p-container-margin shadow-[0px_4px_20px_rgba(90,113,89,0.05)] border border-surface-variant/50">
<div class="flex items-center gap-3 mb-stack-gap-md">
<span class="w-12 h-12 rounded-2xl bg-primary text-on-primary flex items-center justify-center"><span class="material-symbols-outlined">restaurant</span></span>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface leading-tight" data-i18n="lbl_welcome_ks">Welcome to KitchenShare</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-sm" data-i18n="lbl_signin_desc">Tap your name below to cook and share.</p>
</div>
</div>
<div id="ks-auth-error" class="hidden mb-3 p-3 rounded-lg bg-error-container text-on-error-container font-body-md text-body-md text-sm"></div>

<!-- Real email/password login form -->
<div class="mt-stack-gap-md p-4">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-3 text-center" data-i18n="lbl_quick_demo">Log In</p>
<div class="mb-3">
  <label class="block text-small text-on-surface-variant mb-2" data-i18n="lbl_email">Email</label>
  <input id="ks-login-email" type="email" class="w-full rounded-xl border border-surface-variant/50 px-4 py-2 text-body-md text-on-surface focus:ring-2 focus:ring-primary transition-colors" placeholder="name@kitchenshare.app" autocomplete="email"/>
</div>
<div class="mb-4">
  <label class="block text-small text-on-surface-variant mb-2" data-i18n="lbl_password">Password</label>
  <input id="ks-login-pass" type="password" class="w-full rounded-xl border border-surface-variant/50 px-4 py-2 text-body-md text-on-surface focus:ring-2 focus:ring-primary transition-colors" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226" autocomplete="current-password"/>
</div>
<div class="flex items-center gap-3 mb-4">
  <input type="checkbox" id="ks-remember-me" class="rounded border-surface-container/50 w-4 h-4 bg-primary-container focus-visible:outline focus-visible:ring-2 focus-visible:ring-primary transition-colors"/>
  <label for="ks-remember-me" class="text-small text-on-surface-variant" data-i18n="lbl_remember_me">Remember me</label>
</div>
<button id="ks-login-submit" class="w-full rounded-xl bg-primary text-on-primary px-4 py-3 font-body-md text-body-md transition-colors hover:bg-primary/90" data-i18n="btn_login">Sign In</button>
<p class="mt-3 text-small text-on-surface-variant" data-i18n="lbl_forgot_password"><a id="ks-forgot-password" href="#" class="text-primary hover:underline">Forgot Password?</a></p>
<p class="mt-3 text-center text-small text-on-surface-variant">Don't have an account? <a href="signup.html" class="text-primary hover:underline font-medium">Sign Up</a></p>
</div>
<div class="mt-6 pt-4 border-t border-surface-variant/30">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-3 text-center">Quick demo login</p>
<div id="ks-quick-logins" class="grid grid-cols-1 gap-2">
<button type="button" data-quick-email="sugu@kitchenshare.app" data-quick-pass="admin" class="quick-login-btn flex items-center justify-between p-3 rounded-xl bg-surface-container-low border border-surface-variant/30 hover:bg-surface-container transition-colors text-left">
<div><div class="font-body-md text-body-md text-on-surface font-medium">sugu — Admin</div><div class="text-xs text-on-surface-variant">sugu@kitchenshare.app / admin</div></div><span class="material-symbols-outlined text-primary">login</span>
</button>
<button type="button" data-quick-email="swetha@kitchenshare.app" data-quick-pass="6708" class="quick-login-btn flex items-center justify-between p-3 rounded-xl bg-surface-container-low border border-surface-variant/30 hover:bg-surface-container transition-colors text-left">
<div><div class="font-body-md text-body-md text-on-surface font-medium">swetha</div><div class="text-xs text-on-surface-variant">swetha@kitchenshare.app / 6708</div></div><span class="material-symbols-outlined text-primary">login</span>
</button>
<button type="button" data-quick-email="viji@kitchenshare.app" data-quick-pass="1234" class="quick-login-btn flex items-center justify-between p-3 rounded-xl bg-surface-container-low border border-surface-variant/30 hover:bg-surface-container transition-colors text-left">
<div><div class="font-body-md text-body-md text-on-surface font-medium">viji</div><div class="text-xs text-on-surface-variant">viji@kitchenshare.app / 1234</div></div><span class="material-symbols-outlined text-primary">login</span>
</button>
<button type="button" data-quick-email="saravana@kitchenshare.app" data-quick-pass="7394" class="quick-login-btn flex items-center justify-between p-3 rounded-xl bg-surface-container-low border border-surface-variant/30 hover:bg-surface-container transition-colors text-left">
<div><div class="font-body-md text-body-md text-on-surface font-medium">saravana</div><div class="text-xs text-on-surface-variant">saravana@kitchenshare.app / 7394</div></div><span class="material-symbols-outlined text-primary">login</span>
</button>
</div>
<p class="mt-2 text-center text-xs text-on-surface-variant">Tap to fill credentials and sign in</p>
</div>
</div>
</main>
<div id="ks-debug-errors" style="display:none;position:fixed;top:60px;left:10px;right:10px;z-index:999;background:#b91c1c;color:white;padding:12px;border-radius:8px;font-size:13px;max-height:200px;overflow:auto;font-family:monospace;"></div>
<script>window.onerror=function(m,s,l,c,e){var d=document.getElementById('ks-debug-errors');if(d){d.style.display='block';d.innerHTML+='<b>JS Error:</b> '+m+' (line '+l+':'+c+')<br>';}return false;};</script>
<script src="i18n.js"></script>
<script src="js/03_api_social.js"></script>
<script src="js/02_store_users.js"></script>

<script src="js/05_sync_badge_seed.js"></script>

<script src="js/08_achievements.js"></script>
<script src="js/09_celebration_admin.js"></script>
<script src="js/10_comments_content.js"></script>
<script src="js/11_user_data_time.js"></script>
<script src="js/12_inventory_media.js"></script>
<script src="js/13_profile_bookmarks_stats.js"></script>
<script src="js/14_my_recipes_sync.js"></script>
<script src="js/15_catalog_cook_shopping.js"></script>
<script src="js/16_recipe_editor_feed.js"></script>
<script src="js/17_inventory_page.js"></script>
<script src="js/18_recipe_details.js"></script>
<script src="js/19_feed_page.js"></script>
<script src="js/20_shopping_page.js"></script>
<script src="js/21_admin_people_board.js"></script>
<script src="js/22_profile_privacy_boot.js"></script><script src="js/23_pantry_match.js"></script><script src="js/24_diet_safety.js"></script><script src="js/25_cook_mode.js"></script><script src="js/26_pwa_offline.js"></script>
<script>
document.querySelectorAll('[data-quick-email]').forEach(function(btn){
  btn.addEventListener('click', function(){
    var email = btn.getAttribute('data-quick-email');
    var pass = btn.getAttribute('data-quick-pass');
    var emailEl = document.getElementById('ks-login-email');
    var passEl = document.getElementById('ks-login-pass');
    if(emailEl) emailEl.value = email;
    if(passEl) passEl.value = pass;
    var submit = document.getElementById('ks-login-submit');
    if(submit) submit.click();
  });
});
</script>
</body></html>
