<script>
  var profileUid = new URLSearchParams(window.location.search).get('uid') || '';
  var shareUrl = window.location.origin + '/user-profile.html' + (profileUid ? '?uid=' + encodeURIComponent(profileUid) : '');

  function shareName() {
    var el = document.querySelector('h1.font-headline-md');
    return el ? el.textContent.trim() : 'my friend';
  }
  function shareText() {
    return window.t('share_check_out', { name: shareName() });
  }

  document.querySelectorAll('[data-action="copy-link"]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(function () { ksToast(window.t('toast_profile_link_copied')); });
      } else {
        ksToast(window.t('copy_prefix', { url: shareUrl }));
      }
    });
  });
  document.querySelectorAll('[data-action="share-message"]').forEach(function (b) {
    b.addEventListener('click', function () {
      window.location.href = 'mailto:?subject=' + encodeURIComponent(shareText()) + '&body=' + encodeURIComponent(shareText() + ' ' + shareUrl);
    });
  });
  document.querySelectorAll('[data-action="share-whatsapp"]').forEach(function (b) {
    b.addEventListener('click', function () {
      window.open('https://wa.me/?text=' + encodeURIComponent(shareText() + ' ' + shareUrl), '_blank');
    });
  });
  document.querySelectorAll('[data-action="share-instagram"]').forEach(function (b) {
    b.addEventListener('click', function () { window.open('https://instagram.com', '_blank'); });
  });
  document.querySelectorAll('[data-action="share-more"]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (navigator.share) {
        navigator.share({ title: 'KitchenShare Profile', text: shareText(), url: shareUrl }).catch(function () {});
      } else {
        ksToast(window.t('share_more_options', { text: shareText() }));
      }
    });
  });
  document.querySelectorAll('[data-action="send-contact"]').forEach(function (b) {
    b.addEventListener('click', function () {
      ksToast(window.t('profile_shared_with', { name: b.getAttribute('data-contact') }));
    });
  });
</script>
