</div>
<div class="hidden md:flex items-center gap-3">
<button id="order-online-top" type="button" class="inline-flex items-center justify-center gap-2 h-touch-target-min px-6 rounded-full bg-primary text-on-primary font-headline-md text-body-md hover:opacity-90 transition-colors active:scale-95 duration-150 shadow-sm">

</button>
</div>
<datalist id="shop-ingredient-datalist"></datalist>

<span data-i18n="lbl_order_online">Order Online</span>

<button id="clear-completed-mobile" class="flex items-center justify-center h-touch-target-min px-6 rounded-full bg-secondary-container text-on-surface font-headline-md text-body-md hover:bg-secondary-fixed transition-colors active:scale-95 duration-150 w-full max-w-[250px] mx-auto" data-i18n="lbl_clear_completed">
